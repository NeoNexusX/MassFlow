name: Publish Pre-release Package

on:
  push:
    tags:
      - 'v*'          # 推送 v0.1.0a1 等 tag 时触发
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MassFlow
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify package
        run: |
          pip install dist/*.whl
          python -c "
          import importlib, pkgutil
          pkg = importlib.import_module('massflow')
          subs = [n for _, n, _ in pkgutil.walk_packages(pkg.__path__, 'massflow.')]
          print(f'✅ massflow installed with {len(subs)} submodules')
          "

      # === 发布到 GitHub Pages PyPI 索引 ===
      - name: Clone PyPI index repo
        run: |
          git clone https://x-access-token:${{ secrets.PYPI_REPO_TOKEN }}@github.com/${{ github.repository_owner }}/pypi.git /tmp/pypi-repo

      - name: Update PyPI index
        run: |
          # 复制构建产物
          mkdir -p /tmp/pypi-repo/packages
          cp dist/* /tmp/pypi-repo/packages/

          # 生成 PEP 503 索引
          python3 << 'SCRIPT'
          import hashlib, re
          from pathlib import Path

          packages_dir = Path("/tmp/pypi-repo/packages")
          simple_dir = Path("/tmp/pypi-repo/simple")
          simple_dir.mkdir(parents=True, exist_ok=True)

          # 按包名分组
          packages = {}
          for f in sorted(packages_dir.iterdir()):
              if f.suffix in (".whl", ".gz"):
                  name = re.split(r"-\d", f.name, maxsplit=1)[0].lower().replace("-", "_")
                  packages.setdefault(name, []).append(f)

          # 生成根索引
          root_links = "\n".join(f'<a href="{n}/">{n}</a>' for n in sorted(packages))
          (simple_dir / "index.html").write_text(
              f"<!DOCTYPE html>\n<html><body>\n{root_links}\n</body></html>\n"
          )

          # 生成每个包的索引
          NL = "\n"
          for name, files in packages.items():
              pkg_dir = simple_dir / name
              pkg_dir.mkdir(parents=True, exist_ok=True)
              links = []
              for f in files:
                  sha256 = hashlib.sha256(f.read_bytes()).hexdigest()
                  links.append(
                      f'<a href="../../packages/{f.name}#sha256={sha256}">{f.name}</a>'
                  )
              (pkg_dir / "index.html").write_text(
                  f"<!DOCTYPE html>\n<html><body>\n{NL.join(links)}\n</body></html>\n"
              )

          print(f"✅ Generated index for {len(packages)} package(s)")
          SCRIPT

      - name: Push to PyPI index
        run: |
          cd /tmp/pypi-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && echo "No changes to publish" || {
            git commit -m "publish: massflow ${GITHUB_REF_NAME}"
            git push
          }

      # === 同时在 MassFlow 仓库创建 Release 用于内部追踪 ===
      - name: Create Pre-release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
