name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # 先检查 pyproject.toml 里的版本是否已经在 PyPI 上，
  # 已存在则跳过发布，避免重复推送导致构建失败
  check-version:
    if: github.repository == 'NeoNexusX/MassFlow'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version against PyPI
        id: check
        run: |
          version=$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$version" ]; then
            echo "无法从 pyproject.toml 解析版本号" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/massflow/$version/json")
          case "$status" in
            404)
              echo "should-publish=true" >> "$GITHUB_OUTPUT"
              echo "::notice::massflow $version 尚未发布，开始发布"
              ;;
            200)
              echo "should-publish=false" >> "$GITHUB_OUTPUT"
              echo "::notice::massflow $version 已存在于 PyPI，跳过发布"
              ;;
            *)
              echo "查询 PyPI 失败，HTTP $status" >&2
              exit 1
              ;;
          esac

  publish:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/massflow
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install build

      - name: Build package
        run: python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
